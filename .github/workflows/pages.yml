name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'members/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'members/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: validate-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 自己紹介ファイルを検証
        run: node site/build.mjs --check
      - name: 失敗したときの案内
        if: failure()
        run: echo "::notice::書き方は members/README.md を見てください。直して push すれば自動で再チェックされます"

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: サイトをビルド
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
